    // --- REUSABLE BADGES ---
    function StatusBadge({ status, type }) {
      let colorClass = 'bg-slate-100 text-slate-700 border-slate-200';
      const s = String(status || '').toUpperCase();

      if (type === 'health') {
        if (s === 'HEALTHY') colorClass = 'bg-emerald-50 text-emerald-700 border-emerald-200';
        else if (s.includes('TREATMENT')) colorClass = 'bg-amber-50 text-amber-700 border-amber-200';
        else if (s === 'CRITICAL') colorClass = 'bg-rose-50 text-rose-700 border-rose-200';
      } else if (type === 'vaccine') {
        if (s === 'UPCOMING') colorClass = 'bg-emerald-50 text-emerald-700 border-emerald-200';
        else if (s === 'DUE_SOON') colorClass = 'bg-orange-50 text-orange-700 border-orange-200';
        else if (s === 'OVERDUE') colorClass = 'bg-rose-50 text-rose-700 border-rose-200';
      } else {
        if (s === 'AVAILABLE') colorClass = 'bg-emerald-50 text-emerald-700 border-emerald-200';
        else if (s === 'ADOPTED') colorClass = 'bg-blue-50 text-blue-700 border-blue-200';
        else if (s.includes('PENDING') || s.includes('REVIEW')) colorClass = 'bg-amber-50 text-amber-700 border-amber-200';
        else if (s.includes('VISIT')) colorClass = 'bg-purple-50 text-purple-700 border-purple-200';
        else if (s === 'FOSTER') colorClass = 'bg-indigo-50 text-indigo-700 border-indigo-200';
        else if (s.includes('TREATMENT')) colorClass = 'bg-orange-50 text-orange-700 border-orange-200';
      }

      return (
        <span className={`inline-flex items-center px-2.5 py-0.5 rounded-full text-[11px] font-bold border ${colorClass}`}>
          <span className="w-1.5 h-1.5 rounded-full bg-current mr-1.5 opacity-70"></span>
          {status}
        </span>
      );
    }

                    <h1 className="text-2xl font-black text-slate-900 tracking-tight">System Records & Reports</h1>
                    <p className="text-xs text-slate-500">Official census, clinical records, and adoption archives</p>
                  </div>
                  <button
                    onClick={() => window.print()}
                    className="px-4 py-2 rounded-xl bg-teal-700 text-white font-bold text-xs shadow hover:bg-teal-800"
                  >
                    🖨️ Print / Save as PDF
                  </button>
                </div>

                <div id="printable-report" className="bg-white rounded-3xl border border-slate-200 p-8 space-y-4 shadow-sm">
                  <div className="border-b border-slate-200 pb-4 flex justify-between items-center">
                    <div>
                      <h2 className="text-xl font-black text-slate-900">Total Pets Census Report</h2>
                      <p className="text-xs text-slate-500">Sanctuary Register as of {new Date().toLocaleDateString()}</p>
                    </div>
                    <span className="px-2.5 py-1 rounded bg-teal-50 text-teal-800 font-bold text-xs">
                      Total Records: {pets.length}
                    </span>
                  </div>

                  <div className="overflow-x-auto">
                    <table className="w-full text-left text-xs">
                      <thead className="bg-slate-50 font-bold uppercase text-slate-600">
                        <tr>
                          <th className="px-4 py-3">Code</th>
                          <th className="px-4 py-3">Name</th>
                          <th className="px-4 py-3">Species</th>
                          <th className="px-4 py-3">Breed</th>
                          <th className="px-4 py-3">Status</th>
                          <th className="px-4 py-3">Location</th>
                        </tr>
                      </thead>
                      <tbody className="divide-y divide-slate-100">
                        {pets.map(p => (
                          <tr key={p.id}>
                            <td className="px-4 py-3 font-mono font-bold text-teal-800">{p.pet_code}</td>
                            <td className="px-4 py-3 font-bold">{p.name}</td>
                            <td className="px-4 py-3">{p.animal_type}</td>
                            <td className="px-4 py-3">{p.breed}</td>
                            <td className="px-4 py-3"><StatusBadge status={p.adoption_status} /></td>
                            <td className="px-4 py-3 text-slate-600">{p.current_location}</td>
                          </tr>
                        ))}
                      </tbody>
                    </table>
                  </div>
                </div>
              </div>
            )}
          </main>

          {/* FOOTER */}
          <footer className="bg-slate-900 text-slate-400 py-8 border-t border-slate-800 text-xs">
            <div className="max-w-7xl mx-auto px-4 sm:px-6 flex flex-col sm:flex-row justify-between items-center gap-4">
              <div className="flex items-center space-x-2">
                <span className="text-base">🐾</span>
                <span className="font-extrabold text-white">Paws & Care Animal Sanctuary</span>
                <span>— BCA Final Year Project (2025–2026)</span>
              </div>
              <div className="text-slate-500">
                React.js • Tailwind CSS • Node.js • Express • MySQL
              </div>
            </div>
          </footer>

          {/* MODAL: ADOPTION APPLICATION */}
          {showAdoptModal && selectedPet && (
            <div className="fixed inset-0 z-50 bg-slate-900/60 backdrop-blur-sm flex items-center justify-center p-4">
              <div className="bg-white rounded-3xl max-w-lg w-full p-6 sm:p-8 space-y-4 shadow-2xl">
                <div className="flex justify-between items-center border-b border-slate-100 pb-3">
                  <div>
                    <h3 className="text-lg font-black text-slate-900">Adoption Application</h3>
                    <p className="text-xs text-teal-700 font-bold">Applying for: {selectedPet.name} ({selectedPet.breed})</p>
                  </div>
                  <button onClick={() => setShowAdoptModal(false)} className="text-slate-400 hover:text-slate-600 font-bold text-lg">&times;</button>
                </div>

                <form onSubmit={handleApplyAdoption} className="space-y-3 text-xs">
                  <div>
                    <label className="block font-bold text-slate-700 mb-1">Full Legal Name *</label>
                    <input type="text" name="name" required placeholder="e.g. Rahul Sharma" className="w-full px-3 py-2 rounded-xl border border-slate-300 focus:outline-none focus:ring-2 focus:ring-teal-600" />
                  </div>
                  <div className="grid grid-cols-2 gap-3">
                    <div>
                      <label className="block font-bold text-slate-700 mb-1">Phone *</label>
                      <input type="tel" name="phone" required placeholder="+91 9822001122" className="w-full px-3 py-2 rounded-xl border border-slate-300 focus:outline-none focus:ring-2 focus:ring-teal-600" />
                    </div>
                    <div>
                      <label className="block font-bold text-slate-700 mb-1">Email *</label>
                      <input type="email" name="email" required placeholder="name@email.com" className="w-full px-3 py-2 rounded-xl border border-slate-300 focus:outline-none focus:ring-2 focus:ring-teal-600" />
                    </div>
                  </div>
                  <div className="grid grid-cols-2 gap-3">
                    <div>
                      <label className="block font-bold text-slate-700 mb-1">City *</label>
                      <input type="text" name="city" required placeholder="Pune / Mumbai" className="w-full px-3 py-2 rounded-xl border border-slate-300 focus:outline-none focus:ring-2 focus:ring-teal-600" />
                    </div>
                    <div>
                      <label className="block font-bold text-slate-700 mb-1">Occupation</label>
                      <input type="text" name="occupation" placeholder="Software Engineer" className="w-full px-3 py-2 rounded-xl border border-slate-300 focus:outline-none focus:ring-2 focus:ring-teal-600" />
                    </div>
                  </div>
                  <div>
                    <label className="block font-bold text-slate-700 mb-1">Why do you want to adopt {selectedPet.name}? *</label>
                    <textarea rows="2" name="reason" required placeholder="Tell us about your home and family..." className="w-full px-3 py-2 rounded-xl border border-slate-300 focus:outline-none focus:ring-2 focus:ring-teal-600"></textarea>
                  </div>
                  <div className="pt-2 flex justify-end space-x-2">
                    <button type="button" onClick={() => setShowAdoptModal(false)} className="px-4 py-2 rounded-xl bg-slate-100 font-bold text-slate-600">Cancel</button>
                    <button type="submit" className="px-5 py-2 rounded-xl bg-teal-700 hover:bg-teal-800 text-white font-black shadow">Submit Application 🚀</button>
                  </div>
                </form>
              </div>
            </div>
          )}

          {/* MODAL: LOGIN */}
          {showLoginModal && (
            <div className="fixed inset-0 z-50 bg-slate-900/60 backdrop-blur-sm flex items-center justify-center p-4">
              <div className="bg-white rounded-3xl max-w-sm w-full p-6 sm:p-8 space-y-4 shadow-2xl">
                <div className="text-center space-y-1">
                  <div className="w-12 h-12 rounded-2xl bg-teal-50 text-teal-700 mx-auto flex items-center justify-center text-2xl font-black">
                    🐾
                  </div>
                  <h3 className="text-lg font-black text-slate-900">Shelter Portal Login</h3>
                  <p className="text-xs text-slate-500">Sign in to manage animals, medical & adoptions</p>
                </div>

                <form onSubmit={(e) => {
                  e.preventDefault();
                  handleLogin(e.target.username.value, e.target.password.value);
                }} className="space-y-3 text-xs">
                  <div>
                    <label className="block font-bold text-slate-700 mb-1">Username</label>
                    <input type="text" name="username" defaultValue="admin" required className="w-full px-3 py-2.5 rounded-xl border border-slate-300 focus:ring-2 focus:ring-teal-600 focus:outline-none font-bold" />
                  </div>
                  <div>
                    <label className="block font-bold text-slate-700 mb-1">Password</label>
                    <input type="password" name="password" defaultValue="Admin@123" required className="w-full px-3 py-2.5 rounded-xl border border-slate-300 focus:ring-2 focus:ring-teal-600 focus:outline-none font-bold" />
                  </div>
                  <div className="bg-teal-50/70 p-3 rounded-xl border border-teal-200/50 space-y-1 text-[11px] text-teal-900">
                    <p className="font-extrabold">Demo Credentials:</p>
                    <p>• Admin: <span className="font-mono font-bold">admin</span> / <span className="font-mono">Admin@123</span></p>
                    <p>• Doctor: <span className="font-mono font-bold">dr.sharma</span> / <span className="font-mono">Staff@123</span></p>
                    <p>• Adopter: <span className="font-mono font-bold">anita.adopter</span> / <span className="font-mono">User@123</span></p>
                  </div>
                  <button type="submit" className="w-full py-3 rounded-xl bg-teal-700 hover:bg-teal-800 text-white font-black text-xs shadow-md">
                    Sign In 🔐
                  </button>
                  <button type="button" onClick={() => setShowLoginModal(false)} className="w-full text-center text-xs font-bold text-slate-400 hover:text-slate-600 pt-1">
                    Cancel
                  </button>
                </form>
              </div>
            </div>
          )}

          {/* MODAL: ADOPTION CERTIFICATE */}
          {showCertificateModal && (
            <div className="fixed inset-0 z-50 bg-slate-900/60 backdrop-blur-sm flex items-center justify-center p-4">
              <div id="adoption-certificate" className="bg-white rounded-3xl max-w-xl w-full p-8 border-4 border-amber-300 shadow-2xl space-y-6 text-center">
                <div className="space-y-2">
                  <span className="text-xs font-black uppercase tracking-widest text-amber-600 bg-amber-50 px-3 py-1 rounded-full border border-amber-200">
                    Official Certificate of Legal Adoption
                  </span>
                  <h2 className="text-2xl sm:text-3xl font-black text-slate-900 mt-2">Paws & Care Animal Sanctuary</h2>
                  <p className="text-xs text-slate-500">Government Registered Trust • Pune, Maharashtra</p>
                </div>

                <div className="bg-amber-50/50 p-6 rounded-2xl border border-amber-200/60 text-xs text-slate-700 leading-relaxed space-y-3">
                  <p>This certifies that legal, medical, and emotional guardianship of:</p>
                  <p className="text-2xl font-black text-teal-800">{showCertificateModal.petName}</p>
                  <p>has been officially transferred and bestowed upon:</p>
                  <p className="text-lg font-black text-slate-900">{showCertificateModal.adopterName}</p>
                  <p className="text-[11px] text-slate-500 pt-2">
                    The adoptive parent commits to providing lifelong shelter, nutritional food, medical care, and love.
                  </p>
                </div>

                <div className="flex justify-between items-center text-xs text-slate-500 border-t border-slate-200 pt-4">
                  <div className="text-left">
                    <p className="font-mono font-bold text-slate-800">Ref: {showCertificateModal.certCode}</p>
                    <p>Issued: {showCertificateModal.date}</p>
                  </div>
                  <div className="text-right">
                    <p className="font-black text-slate-800">Authorized Signatory</p>
                    <p className="text-[10px] text-teal-700 font-bold">Sanctuary Director</p>
                  </div>
                </div>

                <div className="no-print flex justify-end space-x-2 pt-2">
                  <button onClick={() => window.print()} className="px-5 py-2 rounded-xl bg-teal-700 text-white font-bold text-xs shadow">
                    🖨️ Print Certificate
                  </button>
                  <button onClick={() => setShowCertificateModal(null)} className="px-4 py-2 rounded-xl bg-slate-100 text-slate-700 font-bold text-xs">
                    Close
                  </button>
                </div>
              </div>
            </div>
          )}
        </div>
      );
    }

    // Mount Application
    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
